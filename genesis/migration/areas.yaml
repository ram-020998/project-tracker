# Pseudo-areas (no pack).
pseudo_areas:
  - id: all
    name: Applies everywhere
    scope: >
      Rules, decisions and agreements that constrain every area (the work loop,
      provenance/pointer discipline, the reliability trio requirement, security &
      secrets handling, dependency direction, the area router itself). These
      build into CORE.md (L0), not into a pack.
    topics: [everywhere, global, working agreement, work loop, provenance, pointer, reliability,
             security, secrets, dependency direction, onboarding, CORE]
  - id: history
    name: History (never loaded)
    scope: >
      HISTORY units — what happened when (dated status entries, as-builts of
      shipped phases, superseded decisions). No pack and no code; each row is
      listed in history/INDEX.md with its archive source path and never loaded by
      an agent.
    topics: [history, dated, status entry, as-built, shipped, superseded, changelog, progress]

# Files in the five repos that intentionally match NO area (generated or
# vendored); every one carries a reason (47-01 DoD).
exceptions:
  - glob: genesis/web/static/**
    reason: >
      Generated build artifact — the committed Vite SPA bundle served by
      `genesis serve`; regenerated from web/src, never hand-authored. Knowledge
      about it lives with web-ui (the source) and dev-release-ops (the build).
  - glob: genesis/genesis/api/assets/lavish/**
    reason: >
      Vendored third-party — the MIT Lavish artifact SDK (artifact-sdk.js,
      mermaid-node.js), Genesis-themed, plus its esbuild output (sdk.js, entry.js).
      Not Genesis-authored source; its usage is documented under feature-sdlc.
