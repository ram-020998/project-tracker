# Phase 47 — Genesis knowledge-store area taxonomy
#
# The store is partitioned by *what an agent needs to do*. Each area owns a slice
# of the five code repos (path globs) and a set of `topics` (words that identify
# it in the old docs). A knowledge unit carries one or more `areas` and one
# `primary_area`; a rule/pack is built per area; `gk rules --paths <files>`
# selects areas by matching these globs.
#
# Code globs are REPO-PREFIXED: "<repo>/<path-glob>" where <repo> is one of the
# five source repos. Glob semantics (see migration/scripts/check_areas.py):
#   *   matches within a path segment (does not cross '/')
#   **  matches zero or more whole segments (crosses '/')
#   a trailing "/**" also matches the directory's own files
# Overlap is allowed (a file may belong to several areas); `primary_area` on a
# unit disambiguates. Coverage rule (47-01 DoD): every tracked file in the five
# repos matches >= 1 area glob OR is listed in `exceptions` with a reason.
#
# Two pseudo-areas are not real packs:
#   all      -> rules that apply everywhere; they build into CORE.md (no pack).
#   history  -> HISTORY units; no pack, no code; listed in history/INDEX.md only.
#
# Status: approved with changes 1-3 (2026-10-19). Change 3 split platform-runtime
# into `engine` + `runs-config` and split `appian-parser` out of `appian-kb`.

version: 1
base_tag: knowledge-migration-base

# The five source code repos, resolved under a configurable code root
# (env GENESIS_CODE_ROOT; default auto-detected — see check_areas.py).
repos:
  - genesis                 # the platform (local web app + engine)
  - genesis-core            # the engine / shared node kit (ADR-019)
  - genesis-workflows       # the shared workflow + skill library
  - kiro-agent-sdk          # the ACP adapter / agent SDK
  - genesis-appian-parser   # the Appian package parser (Phase 16)

