      kit (program, agent, cli, validator, gate, subgraph, reliability, healing),
      PlatformState & the run workspace/blackboard, the MCP & CLI registries and
      the typed contracts, plus the platform's run engine (compile/run/resume), the
      SQLite checkpointer, the PlatformContext builder, settings (~/.genesis paths)
      and structured logging, the reliability/contract lint, the test harness, and
      the read-only introspection + control MCP servers.
    topics: [genesis-core, PlatformContext, PlatformState, node kit, kiro_node, reliability trio,
             attach_reliability, attach_healing, CORE_MAJOR, check_compat, McpRegistry, CliRegistry,
             engine, checkpointer, AsyncSqliteSaver, context, settings, "~/.genesis", logging,
             lint, contract parity, introspection, control server]
