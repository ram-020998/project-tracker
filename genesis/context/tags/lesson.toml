areas = ["runs-worker", "web-runs", "api"]
phase = ""
rule = "Keep the per-run SSE bus open until the run is TERMINAL; the client dedupes replayed history and CLOSES the EventSource on terminal final/error, else it reconnects and replays forever."
reviewed_fp = "cfb096a4bdb05261"

