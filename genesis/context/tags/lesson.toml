areas = ["runs-worker", "core-engine", "web-runs"]
phase = ""
rule = "Use only the canonical event kinds (run.started, node.completed, agent.*, validator.result, retry.scheduled, gate.*, run.final, error) — there is NO node.started/node.failed; running = run.cursor."
reviewed_fp = "f45ac596836c68d4"

[L-006]
areas = ["web-runs", "workflows-library", "core-engine"]
phase = ""
rule = "Workflows SHOULD declare a `graph:` topology whose node ids match LangGraph node names; without one, Run Detail derives a fallback from /steps so the graph is never blank."
reviewed_fp = "f2284ec54f84b9b3"

[L-007]
areas = ["web-runs", "chat"]
phase = ""
rule = "The transcript folds `agent.*` events into turns (`buildTranscript` → `groupTurns`, validator/retry notes on the just-closed turn); Markdown answers reuse the existing renderers — no new deps."
reviewed_fp = "91f41d18e3dc4b0e"

[L-008]
areas = ["runs-worker", "web-runs"]
phase = ""
rule = "A generic `worker_exit` must NOT clobber a specific `error` event; empty-message exceptions report their type + a hint."
reviewed_fp = "7dcf72db29654796"

[L-009]
areas = ["core-engine", "runs-worker", "workflows-library", "kb-sync"]
phase = ""
rule = "LangGraph: sync `invoke` can't run async nodes and sync `SqliteSaver` fails under async (use `AsyncSqliteSaver`); `Command(resume=…)` needs a checkpointer-compiled graph."
reviewed_fp = "9d9274019dc45811"

[L-010]
areas = ["api", "web-shell", "web-runs"]
phase = ""
rule = "ALL backend endpoints live under `/api`; the client prepends `/api` centrally and rejects non-JSON — uniform 500s on `/api/*` in the browser usually mean the backend isn't running."
reviewed_fp = "d0dcbced8ea8ff12"

[L-011]
