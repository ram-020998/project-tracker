# 47-09 §2 — golden questions ("nothing is missed").
# Written by genesis-review on 2026-10-20 from the TAG TABLES (context/tags/adr.toml + lesson.toml areas and rules,
# as listed by `genesis-ctx` and the L0 digests), not from memory. One question per [[q]].
#   ask      = the question put to a fresh genesis-dev session
#   expect   = every id the answer must cite (all required)
#   phrase   = a key phrase from the rule text the answer must contain (case-insensitive; "-", "_" and spaces
#              are treated alike by the grader)
#   area     = the area whose tag table the question was drawn from
#   critical = one of the 47-09 §2 critical rules (100 % required)
# Spread: 40 questions, all 22 areas, 14 critical. Graded by reviews/golden_grade.py.
# (47-09 §2 names context/eval/golden.toml as the long-term home; the review agent may only write under reviews/.)

