# context/areas.toml — the area registry (Phase 47, sub-spec 47-02 §3).
#
# An "area" is a slice of Genesis that has its own rules. ADRs, lessons and
# code-map sections (context/tags/*.toml) are tagged with areas; `genesis-ctx pack`
# (47-03) turns a task's areas into the set of rules and code it loads.
#
# Finalized in 47-05 (S4, 2026-10-20): the 22 areas below; `gates` = the bible/05 §6 test/lint commands for the
# repos an area's globs touch (kiro-agent-sdk / genesis-appian-parser gates are taken from those repos, not bible/05).
#
# Schema (47-02 §3):
#   [area.<name>]      name is [a-z0-9-]+
#   title    = string  one-line description
#   paths    = [glob]  globs relative to {{REPOS}} = /Users/ramaswamy.u/repo-gitlab/ramaswamy.u
#                      (a "tracker:" prefix means relative to project-tracker/genesis/).
#                      Every non-cross-cutting area has >= 1 path glob; a file may
#                      belong to several areas.
#   keywords = [string]  routing hints (propose-tags, search)
#   skills   = [string]  optional: skills a pack for this area should surface
#   docs     = [string]  optional: docs a pack for this area should list
#   gates    = [string]  optional: gate commands `genesis-ctx check` prints for the area
#   always   = true      cross-cutting areas only — included in every pack; no paths
#   Any other key is a lint error. Globs: `**` = any number of path segments (incl. none),
#   `*` / `?` = within one segment.
#
# The five repos under {{REPOS}}: genesis (app: genesis/genesis + genesis/web),
# genesis-core, genesis-workflows, kiro-agent-sdk, genesis-appian-parser.

# ───────────────────────────── engine & SDK ─────────────────────────────

[area.core-engine]
title    = "genesis-core: LangGraph nodes, state, validators, reliability, healing"
paths    = ["genesis-core/genesis_core/**"]
keywords = ["node", "graph", "state", "validator", "reliability", "healing", "subgraph", "langgraph", "gate"]
skills   = ["genesis-backend-dev"]
gates    = ["cd genesis-core && ../genesis/.venv/bin/python -m pytest -q -p no:warnings",
            "cd genesis-core && ../genesis/.venv/bin/ruff check genesis_core"]

[area.sdk-acp]
title    = "kiro-agent-sdk: ACP client/session, tool bridge"
paths    = ["kiro-agent-sdk/src/**"]
keywords = ["acp", "sdk", "session", "agent client", "tool bridge", "mcp env"]
skills   = ["genesis-backend-dev"]
gates    = ["cd kiro-agent-sdk && .venv/bin/python -m pytest -q"]

[area.parser]
title    = "genesis-appian-parser: Appian object/XML parsing"
paths    = ["genesis-appian-parser/genesis_appian_parser/**"]
keywords = ["parser", "appian", "xml", "sail parse", "object parse"]
skills   = ["genesis-backend-dev"]
gates    = ["cd genesis-appian-parser && ../genesis/.venv/bin/python -m pytest -q",
            "cd genesis-appian-parser && ../genesis/.venv/bin/ruff check ."]

[area.workflows-library]
title    = "genesis-workflows: workflows, skills, registries, CI publish gates"
paths    = ["genesis-workflows/workflows/**", "genesis-workflows/skills/**",
            "genesis-workflows/ci/**", "genesis-workflows/schemas/**",
            "genesis-workflows/registry.json", "genesis-workflows/bundles.json",
            "genesis-workflows/skills-registry.json", "genesis-workflows/mcp-registry.json",
            "genesis-workflows/cli-registry.json"]
keywords = ["workflow", "registry", "bundle", "publish gate", "skill package", "langgraph.json"]
skills   = ["genesis-workflow-authoring"]

# ───────────────────────────── genesis backend ─────────────────────────────
gates    = ["cd genesis-workflows && ../genesis/.venv/bin/python ci/validate_library.py",
            "cd genesis-workflows && ../genesis/.venv/bin/python -m pytest -q workflows --ignore=workflows/_fixtures"]

[area.runs-worker]
title    = "Run manager, subprocess worker, HITL gates, events/SSE, checkpoints, scheduler"
paths    = ["genesis/genesis/runs/**", "genesis/genesis/runtime/engine.py",
            "genesis/genesis/runtime/checkpoint.py", "genesis/genesis/runtime/scheduler.py",
            "genesis/genesis/runtime/schedule_store.py", "genesis/genesis/api/run_routes.py",
            "genesis/genesis/api/schedules.py"]
keywords = ["run", "worker", "subprocess", "hitl", "gate", "event", "sse", "checkpoint", "resume", "schedule"]
skills   = ["genesis-backend-dev"]
gates    = ["cd genesis && .venv/bin/python -m pytest -q -p no:warnings",
            "cd genesis && .venv/bin/ruff check genesis"]

[area.db]
title    = "genesis DB layer and migrations"
paths    = ["genesis/genesis/db/**"]
keywords = ["database", "migration", "schema", "sqlite", "runner"]
skills   = ["genesis-db-migration"]
gates    = ["cd genesis && .venv/bin/python -m pytest -q -p no:warnings",
            "cd genesis && .venv/bin/ruff check genesis"]

[area.api]
title    = "FastAPI /api surface"
paths    = ["genesis/genesis/api/**"]
keywords = ["api", "fastapi", "route", "endpoint", "router"]
skills   = ["genesis-backend-dev"]
gates    = ["cd genesis && .venv/bin/python -m pytest -q -p no:warnings",
            "cd genesis && .venv/bin/ruff check genesis"]

[area.chat]
title    = "Chat, copilot, chat modes, skills-in-chat"
paths    = ["genesis/genesis/chat/**", "genesis/genesis/skills/**",
            "genesis/web/src/features/chat/**", "kiro-agent-sdk/src/**"]
keywords = ["chat", "copilot", "chat mode", "skill", "steering", "session"]
skills   = ["genesis-backend-dev", "genesis-web-dev"]
gates    = ["cd kiro-agent-sdk && .venv/bin/python -m pytest -q",
            "cd genesis && .venv/bin/python -m pytest -q -p no:warnings",
            "cd genesis && .venv/bin/ruff check genesis",
            "cd genesis/web && npm run lint && npm run typecheck && npm test",
            "cd genesis/web && npm run build   # then commit web/static/"]

