# 47-04 scripted migration plan (schema: 47-03 §3.1). Run one step at a time:
#   genesis-ctx archive --plan agent-system/migration/47-04.plan.toml --step N [--apply]
# Steps 4 (mark) and 5 (propose-tags) are genesis-ctx commands, not archive entries.
# BASELINE for verify-lossless: d89f763efe69d424c99290ebbae892a5c112c75e (13 baseline files unchanged since b127a4d).
date = "2026-10-20"

# Step 1 — tracker.md §6 body. The newest entry (2026-10-20, Phase 47) stays as §6's first short entry;
# everything after it, to EOF, moves.
[[step]]
n       = 1
name    = "Status log"
source  = "tracker.md"
dest    = "archive/tracker-status-log.md"
start   = '^- \*\*2026-10-20 — Phase 47 \(Agent Context System\)'
include_start = false
end     = "EOF"
pointer = "each"
note    = "From Phase 47 on: ≤ 5 lines per phase; detail lives in `progress/`."

# Step 2 — bible/08 shipped/closed ### blocks (47-04 §4). Stops amended with the user (S3): the real closing line is
# bold (`**Do not start backlog…`), and the Phase 16 CLOSED block is followed by a `---` + a history/backlog list.
[[step]]
n        = 2
name     = "Shipped phases"
source   = "bible/08-roadmap-and-backlog.md"
dest     = "archive/bible-08-shipped-phases.md"
heading  = '^### '
contains = ["SHIPPED", "CLOSED"]
stop     = ['^### ', '^## ', '^---\s*$', '^\*{0,2}Do not start backlog']
pointer  = "each"

# Step 2 (b) — user-approved deviation (beyond ### blocks): the Shipped / Phase 13 / Phase 14 history bullets after
# the `---`. "Backlog (specs/backlog/)", "Open follow-ups" and the closing paragraph stay.
[[step]]
n       = 2
name    = "Shipped phases"
source  = "bible/08-roadmap-and-backlog.md"
dest    = "archive/bible-08-shipped-phases.md"
start   = '^- \*\*Shipped:\*\* Phases 1–6'
include_start = true
end     = '^- \*\*Backlog \(`specs/backlog/`\):\*\*'
pointer = "each"

# Step 3 — AGENT_ONBOARDING.md historical note + the ⭐ SHIPPED Phase 27–30 banner sections.
[[step]]
n       = 3
name    = "Onboarding banners"
source  = "AGENT_ONBOARDING.md"
dest    = "archive/onboarding-banners.md"
start   = '^> \*\*Note:\*\* the Phase 26–30 blocks below are kept as the historical release banners'
include_start = true
end     = '^## 📚 The bible manifest'
pointer = "each"
