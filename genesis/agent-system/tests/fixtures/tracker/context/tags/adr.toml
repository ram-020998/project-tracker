rule = "Memory lives in its own memory.db with its own migrations."

[ADR-061]
title = "Workbench board"
status = "accepted"
areas = ["stories-workbench"]
rule = "Each application has one Kanban board."

[ADR-063]
title = "Collaboration Hub"
status = "accepted"
areas = ["stories-workbench"]
rule = "Collaboration is local-first with selective centralization."

[ADR-064]
title = "Hub Appian application"
status = "accepted"
